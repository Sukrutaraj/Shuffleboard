<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shuffleboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;600&display=swap');

*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#0d0d0d;
  font-family:'DM Sans',sans-serif;
  color:#f0e6d0;
}

/* ── START SCREEN ── */
#startScreen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:28px;z-index:30;
  background:radial-gradient(ellipse at 50% 60%, #1a120a 0%, #0d0d0d 70%);
}
.game-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(52px,8vw,96px);
  letter-spacing:8px;
  background:linear-gradient(135deg,#d4a853 0%,#f0d080 50%,#b8812a 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:none;
  line-height:1;
}
.subtitle{
  font-size:14px;letter-spacing:3px;text-transform:uppercase;
  color:#8a7060;margin-top:-18px;
}
.setup-card{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(212,168,83,0.2);
  border-radius:16px;
  padding:28px 36px;
  display:flex;flex-direction:column;gap:20px;
  min-width:320px;max-width:440px;width:90%;
}
.field-row{display:flex;flex-direction:column;gap:6px;}
label{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#a08060;}
input,select{
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(212,168,83,0.25);
  border-radius:8px;color:#f0e6d0;
  font-size:16px;font-family:'DM Sans',sans-serif;
  padding:10px 14px;outline:none;width:100%;
  transition:border-color .2s;
}
input:focus,select:focus{border-color:#d4a853;}
select option{background:#1a1209;color:#f0e6d0;}

.row2{display:flex;gap:12px;}
.row2 .field-row{flex:1;}

.start-btn{
  background:linear-gradient(135deg,#d4a853,#b8812a);
  border:none;border-radius:10px;
  color:#0d0d0d;font-family:'Bebas Neue',sans-serif;
  font-size:24px;letter-spacing:3px;
  padding:14px 0;cursor:pointer;width:100%;
  transition:filter .2s,transform .1s;
}
.start-btn:hover{filter:brightness(1.15);}
.start-btn:active{transform:scale(0.98);}

.hint{font-size:12px;color:#5a4a3a;text-align:center;letter-spacing:1px;}

/* ── HUD ── */
#hud{
  position:absolute;top:0;left:0;right:0;
  height:56px;display:none;
  align-items:center;justify-content:space-between;
  padding:0 24px;z-index:10;
  background:linear-gradient(180deg,rgba(0,0,0,0.8) 0%,transparent 100%);
}
.player-hud{display:flex;align-items:center;gap:12px;}
.hud-name{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#a08060;}
.hud-score{
  font-family:'Bebas Neue',sans-serif;font-size:38px;
  line-height:1;
}
.hud-pucks{display:flex;gap:5px;align-items:center;}
.hud-pip{
  width:11px;height:11px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,0.3);
  transition:background .3s;
}
.hud-mid{
  font-family:'Bebas Neue',sans-serif;
  font-size:14px;letter-spacing:4px;color:#5a4a3a;
}
#turnIndicator{
  position:absolute;top:62px;left:50%;transform:translateX(-50%);
  font-size:12px;letter-spacing:2px;text-transform:uppercase;
  color:#a08060;background:rgba(0,0,0,0.5);
  padding:4px 14px;border-radius:20px;display:none;
  white-space:nowrap;
}

/* ── WIN OVERLAY ── */
#winOverlay{
  display:none;
  position:absolute;inset:0;z-index:40;
  background:rgba(0,0,0,0.82);
  align-items:center;justify-content:center;flex-direction:column;gap:22px;
}
#winOverlay.show{display:flex;}
.win-badge{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(36px,6vw,72px);
  letter-spacing:5px;
  background:linear-gradient(135deg,#d4a853,#f0d080,#b8812a);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.win-scores{font-size:20px;color:#a08060;letter-spacing:2px;}
.win-scores span{color:#f0e6d0;font-weight:600;}
.win-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
.win-btn{
  padding:12px 26px;border-radius:9px;border:none;
  font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;
  cursor:pointer;transition:filter .2s;
}
.win-btn.primary{background:linear-gradient(135deg,#d4a853,#b8812a);color:#0d0d0d;}
.win-btn.secondary{background:rgba(255,255,255,0.08);color:#f0e6d0;border:1px solid rgba(212,168,83,0.3);}
.win-btn:hover{filter:brightness(1.2);}

canvas{display:block;touch-action:none;}
</style>
</head>
<body>

<!-- ── START SCREEN ── -->
<div id="startScreen">
  <div>
    <div class="game-title">SHUFFLEBOARD</div>
    <div class="subtitle">Klassiskt skjutbordsspel</div>
  </div>

  <div class="setup-card">
    <div class="row2">
      <div class="field-row">
        <label>🔴 Spelare 1</label>
        <input id="p1name" placeholder="Röd" maxlength="14" value="Spelare 1">
      </div>
      <div class="field-row">
        <label>🔵 Spelare 2</label>
        <input id="p2name" placeholder="Blå" maxlength="14" value="Spelare 2">
      </div>
    </div>

    <div class="row2">
      <div class="field-row">
        <label>Rundor</label>
        <select id="rounds">
          <option value="3">3 rundor</option>
          <option value="5" selected>5 rundor</option>
          <option value="7">7 rundor</option>
        </select>
      </div>
      <div class="field-row">
        <label>Svårighet</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
    </div>

    <button class="start-btn" onclick="startGame()">STARTA SPELET</button>
  </div>

  <div class="hint">Dra pucken för att skjuta · Mus eller touch</div>
</div>

<!-- ── HUD ── -->
<div id="hud">
  <div class="player-hud" id="hud1">
    <div class="hud-score" id="score1El" style="color:#e05050">0</div>
    <div>
      <div class="hud-name" id="name1El">Spelare 1</div>
      <div class="hud-pucks" id="pips1"></div>
    </div>
  </div>
  <div style="text-align:center">
    <div class="hud-mid" id="roundEl">RUNDA 1/5</div>
  </div>
  <div class="player-hud" id="hud2" style="flex-direction:row-reverse;">
    <div class="hud-score" id="score2El" style="color:#4090e0">0</div>
    <div style="text-align:right">
      <div class="hud-name" id="name2El">Spelare 2</div>
      <div class="hud-pucks" id="pips2" style="justify-content:flex-end"></div>
    </div>
  </div>
</div>
<div id="turnIndicator"></div>

<!-- ── WIN OVERLAY ── -->
<div id="winOverlay">
  <div class="win-badge" id="winBadge">🏆 SPELARE 1 VINNER!</div>
  <div class="win-scores" id="winScores"></div>
  <div class="win-btns">
    <button class="win-btn primary" onclick="playAgain()">SPELA IGEN</button>
    <button class="win-btn secondary" onclick="goMenu()">HUVUDMENY</button>
  </div>
</div>

<canvas id="game"></canvas>

<script>
/* ═══════════════════════════════════════════
   SHUFFLEBOARD  –  Enhanced Edition
   ═══════════════════════════════════════════ */

const canvas = document.getElementById("game");
const ctx    = canvas.getContext("2d");

/* ─── Resize ─── */
function resize(){
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize",()=>{ resize(); if(gameState!=="start") rebuild(); });

/* ─── Audio ─── */
const AC = new (window.AudioContext||window.webkitAudioContext)();
function noise(freq,vol,dur){
  try{
    const buf=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(AC.sampleRate*dur*0.4));
    const src=AC.createBufferSource(); src.buffer=buf;
    const f=AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=freq; f.Q.value=2;
    const g=AC.createGain(); g.gain.value=vol;
    src.connect(f);f.connect(g);g.connect(AC.destination);
    src.start();src.stop(AC.currentTime+dur);
  }catch(e){}
}
function sndHit(v){ noise(600+v*50, Math.min(0.5,v*0.04+0.1), 0.06); }
function sndWall()  { noise(300, 0.15, 0.04); }
function sndScore() { noise(880, 0.3, 0.15); setTimeout(()=>noise(1100,0.2,0.1),120); }
function sndFall()  { noise(200, 0.25, 0.12); }
function sndFanfare(){
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>noise(f,0.3,0.18),i*140));
}

/* ─── Config ─── */
const PUCK_R  = 15;
const MAX_PER = 4;   // pucks per player per round
const DIFF_CFG = {
  easy:   { friction:0.988, zones:[70,160,250],  aimGuide:true  },
  medium: { friction:0.980, zones:[50,115,185],  aimGuide:false },
  hard:   { friction:0.970, zones:[35, 80,130],  aimGuide:false },
};

/* ─── Game state ─── */
let gameState = "start";   // start | playing | roundOver | gameOver
let cfg, p1Name, p2Name, totalRounds;
let totalScore = [0,0];
let round, roundScore;
let pucks, currentPlayer, pucksLeft, activePuck;
let dragging, dragStart, dragCurrent, aimTrail=[];

/* ─── Layout (computed each resize) ─── */
let BX,BY,BW,BH,M;  // board x,y,w,h, margin

function rebuild(){
  const HUD_H = 56;
  const PAD   = 20;
  M  = 40;
  BX = PAD;
  BY = HUD_H + PAD;
  BW = canvas.width  - PAD*2;
  BH = canvas.height - HUD_H - PAD*2;
  // Ensure board isn't taller than wide*0.6 (landscape feel)
  if(BH > BW*0.55){ BH = BW*0.55; BY = HUD_H + (canvas.height-HUD_H-BH)/2; }
}

/* ─── Start ─── */
function startGame(){
  try{ AC.resume(); }catch(e){}
  p1Name     = document.getElementById("p1name").value.trim() || "Spelare 1";
  p2Name     = document.getElementById("p2name").value.trim() || "Spelare 2";
  totalRounds= parseInt(document.getElementById("rounds").value);
  cfg        = DIFF_CFG[document.getElementById("difficulty").value];

  document.getElementById("startScreen").style.display = "none";
  document.getElementById("hud").style.display = "flex";
  document.getElementById("turnIndicator").style.display = "block";
  document.getElementById("name1El").textContent = p1Name;
  document.getElementById("name2El").textContent = p2Name;

  rebuild();
  totalScore = [0,0];
  round = 0;
  gameState = "playing";
  startRound();
}

function startRound(){
  round++;
  roundScore = [0,0];
  pucks = [];
  currentPlayer = (round-1)%2;   // alternate who goes first
  pucksLeft = [MAX_PER, MAX_PER];
  activePuck = null;
  dragging = false;
  endRoundScheduled = false;
  updateHUD();
  spawnPuck();
}

function goMenu(){
  gameState="start";
  document.getElementById("winOverlay").classList.remove("show");
  document.getElementById("hud").style.display="none";
  document.getElementById("turnIndicator").style.display="none";
  document.getElementById("startScreen").style.display="flex";
}
function playAgain(){
  document.getElementById("winOverlay").classList.remove("show");
  totalScore=[0,0]; round=0;
  gameState="playing";
  startRound();
}

/* ─── HUD ─── */
function updateHUD(){
  document.getElementById("score1El").textContent = totalScore[0];
  document.getElementById("score2El").textContent = totalScore[1];
  document.getElementById("roundEl").textContent  =
    `RUNDA ${Math.min(round,totalRounds)} / ${totalRounds}`;
  // puck pips
  [0,1].forEach(pl=>{
    const el = document.getElementById("pips"+(pl+1));
    el.innerHTML="";
    for(let i=0;i<MAX_PER;i++){
      const d=document.createElement("div");
      d.className="hud-pip";
      const played = MAX_PER - pucksLeft[pl];
      d.style.background = i<played
        ? (pl===0?"#e05050":"#4090e0")
        : "transparent";
      el.appendChild(d);
    }
  });
  const ti = document.getElementById("turnIndicator");
  if(gameState==="playing" && activePuck){
    const name = currentPlayer===0?p1Name:p2Name;
    const col  = currentPlayer===0?"#e05050":"#4090e0";
    ti.textContent = `${name} spelar`;
    ti.style.color = col;
  } else {
    ti.textContent = "";
  }
}

/* ─── Spawn ─── */
function spawnPuck(){
  if(gameState!=="playing") return;

  // All pucks used up → end round
  if(pucksLeft[0]<=0 && pucksLeft[1]<=0){ endRound(); return; }

  // Skip to next player if current has no pucks left
  if(pucksLeft[currentPlayer]<=0) currentPlayer=1-currentPlayer;

  const isLeft = currentPlayer===0;
  // p0 starts on LEFT, shoots RIGHT
  // p1 starts on RIGHT, shoots LEFT
  const startX = isLeft ? BX+PUCK_R+6 : BX+BW-PUCK_R-6;
  const startY  = BY + BH/2;

  activePuck = {
    x:startX, y:startY,
    vx:0, vy:0,
    r:PUCK_R,
    color: currentPlayer===0?"#e05050":"#4090e0",
    glow:  currentPlayer===0?"#ff6666":"#66aaff",
    moving:false, played:false, out:false,
    player:currentPlayer,
    trail:[]
  };
  pucks.push(activePuck);
  pucksLeft[currentPlayer]--;
  updateHUD();
}

/* ─── Input ─── */
function getPos(e){
  const r=canvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return { x:src.clientX-r.left, y:src.clientY-r.top };
}

canvas.addEventListener("pointerdown",e=>{
  if(gameState!=="playing") return;
  if(!activePuck||activePuck.moving) return;
  try{ AC.resume(); }catch(ex){}
  const p=getPos(e);
  if(Math.hypot(p.x-activePuck.x,p.y-activePuck.y)<=activePuck.r*2.5){
    dragging=true; dragStart={...p}; dragCurrent={...p};
    canvas.setPointerCapture(e.pointerId);
  }
});
canvas.addEventListener("pointermove",e=>{
  if(!dragging) return;
  dragCurrent=getPos(e);
  // build aim trail
  aimTrail=[];
  if(cfg.aimGuide){
    let sx=activePuck.x, sy=activePuck.y;
    let vx=(dragCurrent.x-dragStart.x)*0.12;
    let vy=(dragCurrent.y-dragStart.y)*0.12;
    for(let i=0;i<40;i++){
      sx+=vx; sy+=vy; vx*=cfg.friction; vy*=cfg.friction;
      aimTrail.push({x:sx,y:sy});
      if(Math.abs(vx)<0.2&&Math.abs(vy)<0.2) break;
    }
  }
});
canvas.addEventListener("pointerup",e=>{
  if(!dragging||!activePuck) return;
  dragging=false;
  const p=getPos(e);
  const vx=(p.x-dragStart.x)*0.12;
  const vy=(p.y-dragStart.y)*0.12;
  const spd=Math.hypot(vx,vy);
  // Too small a flick → cancel, put puck back
  if(spd<0.5){
    pucks.pop();
    pucksLeft[currentPlayer]++;
    activePuck=null;
    spawnPuck();
    return;
  }
  activePuck.vx=vx; activePuck.vy=vy;
  activePuck.moving=true; activePuck.played=true;
  activePuck=null;
  aimTrail=[];
  // Alternate to other player for next spawn
  currentPlayer=1-currentPlayer;
});

/* ─── Physics ─── */
function physics(){
  // Collisions
  for(let i=0;i<pucks.length;i++){
    for(let j=i+1;j<pucks.length;j++){
      const a=pucks[i],b=pucks[j];
      if(a.out||b.out) continue;
      const dx=b.x-a.x,dy=b.y-a.y;
      const d=Math.hypot(dx,dy);
      if(d>0&&d<a.r+b.r){
        sndHit(Math.hypot(a.vx-b.vx,a.vy-b.vy));
        const nx=dx/d,ny=dy/d;
        const overlap=(a.r+b.r-d)*0.5;
        a.x-=nx*overlap; a.y-=ny*overlap;
        b.x+=nx*overlap; b.y+=ny*overlap;
        const dvx=a.vx-b.vx,dvy=a.vy-b.vy;
        const dot=dvx*nx+dvy*ny;
        if(dot>0){
          a.vx-=dot*nx; a.vy-=dot*ny;
          b.vx+=dot*nx; b.vy+=dot*ny;
          a.moving=b.moving=true;
        }
      }
    }
  }

  // Move each puck
  pucks.forEach(p=>{
    if(!p.moving||p.out) return;

    p.trail.push({x:p.x,y:p.y});
    if(p.trail.length>8) p.trail.shift();

    p.x+=p.vx; p.y+=p.vy;
    p.vx*=cfg.friction; p.vy*=cfg.friction;

    // Side walls
    if(p.y<BY+p.r){
      p.y=BY+p.r; p.vy=Math.abs(p.vy)*0.55; sndWall();
    }
    if(p.y>BY+BH-p.r){
      p.y=BY+BH-p.r; p.vy=-Math.abs(p.vy)*0.55; sndWall();
    }

    // Off left/right end → out
    if(p.x<BX-p.r || p.x>BX+BW+p.r){
      p.out=true; p.moving=false; sndFall();
    }

    // Stop
    if(Math.abs(p.vx)<0.05&&Math.abs(p.vy)<0.05){ p.moving=false; p.trail=[]; }
  });
}

/* ─── Score ─── */
function puckZoneScore(p){
  if(p.out) return 0;
  const zones=cfg.zones;
  // p0 shoots from LEFT → lands on RIGHT half → measure distance from RIGHT wall
  // p1 shoots from RIGHT → lands on LEFT half → measure distance from LEFT wall
  let d;
  if(p.player===0){
    d = (BX+BW) - p.x;   // distance from right wall
  } else {
    d = p.x - BX;          // distance from left wall
  }
  // Puck must have crossed at least halfway to score
  if(d<0 || d > BW*0.5) return 0;
  // Zones: 10 = closest to far wall, 5 = middle, 2 = furthest in
  if(d < zones[0]) return 10;
  if(d < zones[1]) return 5;
  if(d < zones[2]) return 2;
  return 0;
}

function allSettled(){
  return pucksLeft[0]<=0 && pucksLeft[1]<=0
      && !activePuck
      && pucks.every(p=>!p.moving);
}

let endRoundScheduled = false;

function endRound(){
  if(endRoundScheduled) return;
  endRoundScheduled = true;
  gameState="roundOver";
  let rs=[0,0];
  pucks.forEach(p=>{ rs[p.player]+=puckZoneScore(p); });
  roundScore=rs;
  totalScore[0]+=rs[0];
  totalScore[1]+=rs[1];
  sndScore();
  updateHUD();

  if(round>=totalRounds){
    // Game over
    setTimeout(()=>{
      sndFanfare();
      const w = totalScore[0]>totalScore[1]?0:(totalScore[1]>totalScore[0]?1:-1);
      const badge = document.getElementById("winBadge");
      const scDiv = document.getElementById("winScores");
      if(w===-1){
        badge.textContent="🤝 OAVGJORT!";
        badge.style.background="linear-gradient(135deg,#aaa,#fff)";
      } else {
        badge.textContent=`🏆 ${w===0?p1Name:p2Name} VINNER!`;
        badge.style.background=w===0
          ?"linear-gradient(135deg,#e05050,#ff9090)"
          :"linear-gradient(135deg,#4090e0,#90c0ff)";
      }
      badge.style.webkitBackgroundClip="text";
      badge.style.webkitTextFillColor="transparent";
      scDiv.innerHTML=`<span>${p1Name}</span> ${totalScore[0]} – ${totalScore[1]} <span>${p2Name}</span>`;
      document.getElementById("winOverlay").classList.add("show");
      gameState="gameOver";
    },1800);
  } else {
    // Next round after delay
    setTimeout(()=>{
      gameState="playing";
      startRound();
    },2200);
  }
}

/* ─── Draw ─── */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(gameState==="start") return;

  drawBoard();

  // Aim guide
  if(dragging && activePuck && cfg.aimGuide && aimTrail.length>1){
    ctx.save();
    ctx.strokeStyle="rgba(255,255,255,0.18)";
    ctx.lineWidth=2;
    ctx.setLineDash([6,8]);
    ctx.beginPath();
    ctx.moveTo(activePuck.x,activePuck.y);
    aimTrail.forEach(pt=>ctx.lineTo(pt.x,pt.y));
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // Drag arrow
  if(dragging && activePuck){
    const dx=dragCurrent.x-dragStart.x, dy=dragCurrent.y-dragStart.y;
    const len=Math.hypot(dx,dy);
    if(len>8){
      ctx.save();
      ctx.strokeStyle="rgba(255,255,255,0.35)";
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(activePuck.x,activePuck.y);
      ctx.lineTo(activePuck.x+dx*0.7, activePuck.y+dy*0.7);
      ctx.stroke();
      ctx.restore();
    }
  }

  // Puck trails
  pucks.forEach(p=>{
    if(p.trail.length<2) return;
    ctx.save();
    for(let i=1;i<p.trail.length;i++){
      const alpha=(i/p.trail.length)*0.3;
      const r=p.r*(i/p.trail.length)*0.7;
      ctx.fillStyle=p.glow.replace(")",`,${alpha})`).replace("rgb","rgba");
      ctx.beginPath();
      ctx.arc(p.trail[i].x,p.trail[i].y,r,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  });

  // Pucks
  pucks.forEach(p=>{
    if(p.out) return;
    ctx.save();
    // Glow
    ctx.shadowColor=p.glow;
    ctx.shadowBlur = p.moving ? 18 : 8;
    // Body
    const grad=ctx.createRadialGradient(p.x-p.r*0.3,p.y-p.r*0.3,p.r*0.1,p.x,p.y,p.r);
    grad.addColorStop(0,"#ffffff44");
    grad.addColorStop(0.3,p.color);
    grad.addColorStop(1, p.color.replace("#","#")+"aa");
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
    // Rim
    ctx.strokeStyle="rgba(255,255,255,0.4)";
    ctx.lineWidth=1.5;
    ctx.stroke();
    // Score label on settled pucks
    const sc=puckZoneScore(p);
    if(!p.moving && sc>0){
      ctx.shadowBlur=0;
      ctx.fillStyle="#fff";
      ctx.font=`bold ${p.r}px 'DM Sans',sans-serif`;
      ctx.textAlign="center";
      ctx.textBaseline="middle";
      ctx.fillText(sc, p.x, p.y);
    }
    ctx.restore();
  });

  // Active puck highlight (pulse)
  if(activePuck && !dragging){
    const pulse=0.5+0.5*Math.sin(Date.now()*0.006);
    ctx.save();
    ctx.strokeStyle=activePuck.glow;
    ctx.lineWidth=2.5;
    ctx.globalAlpha=0.5+0.4*pulse;
    ctx.beginPath();
    ctx.arc(activePuck.x,activePuck.y,activePuck.r+5+pulse*3,0,Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  // Round-over scores flash
  if(gameState==="roundOver"){
    ctx.save();
    ctx.fillStyle="rgba(0,0,0,0.55)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#f0e6d0";
    ctx.font=`bold ${Math.floor(canvas.width*0.04)}px 'Bebas Neue',sans-serif`;
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    const mid=canvas.height/2;
    ctx.fillText(`Runda ${round} klar!`,canvas.width/2,mid-40);
    ctx.font=`${Math.floor(canvas.width*0.035)}px 'DM Sans',sans-serif`;
    ctx.fillStyle="#e05050";
    ctx.fillText(`${p1Name}: +${roundScore[0]}`,canvas.width/2,mid+5);
    ctx.fillStyle="#4090e0";
    ctx.fillText(`${p2Name}: +${roundScore[1]}`,canvas.width/2,mid+42);
    ctx.restore();
  }
}

function drawBoard(){
  const zones=cfg.zones;
  const r=8; // corner radius

  // Board background – warm wood feel
  const woodGrad=ctx.createLinearGradient(BX,BY,BX,BY+BH);
  woodGrad.addColorStop(0,"#f5e6c8");
  woodGrad.addColorStop(0.5,"#ead5a8");
  woodGrad.addColorStop(1,"#dfc890");
  ctx.save();
  ctx.beginPath();
  roundRect(ctx,BX,BY,BW,BH,r);
  ctx.fillStyle=woodGrad;
  ctx.fill();

  // Wood grain lines
  ctx.globalAlpha=0.06;
  ctx.strokeStyle="#7a5030";
  ctx.lineWidth=1;
  for(let i=0;i<12;i++){
    const y=BY+BH*i/12+Math.sin(i*1.3)*4;
    ctx.beginPath();ctx.moveTo(BX,y);ctx.lineTo(BX+BW,y);ctx.stroke();
  }
  ctx.globalAlpha=1;

  // Scoring zones – left side (player 0)
  drawZoneSide(zones, 0);
  // Scoring zones – right side (player 1)
  drawZoneSide(zones, 1);

  // Center divider
  ctx.strokeStyle="rgba(100,70,30,0.3)";
  ctx.lineWidth=2;
  ctx.setLineDash([8,8]);
  ctx.beginPath();
  ctx.moveTo(BX+BW/2,BY+r);
  ctx.lineTo(BX+BW/2,BY+BH-r);
  ctx.stroke();
  ctx.setLineDash([]);

  // Board border
  ctx.beginPath();
  roundRect(ctx,BX,BY,BW,BH,r);
  ctx.strokeStyle="rgba(100,70,30,0.6)";
  ctx.lineWidth=3;
  ctx.stroke();

  ctx.restore();
}

function drawZoneSide(zones, player){
  // player 0 shoots LEFT→RIGHT, zones are measured from RIGHT wall
  // player 1 shoots RIGHT→LEFT, zones are measured from LEFT wall
  // Colors: innermost zone (closest to far wall) = gold/10pts
  const colors=["rgba(212,168,83,0.30)","rgba(160,190,90,0.20)","rgba(90,150,200,0.15)"];
  const labels=[10,5,2];

  // For p0: zones drawn from right side of board inward
  // For p1: zones drawn from left side of board inward
  const fromRight = player===0;
  const wallX = fromRight ? BX+BW : BX;
  const dir   = fromRight ? -1 : 1;

  for(let i=0;i<3;i++){
    const near = i===0 ? 0 : zones[i-1];
    const far  = zones[i];
    const x0   = wallX + dir*far;
    const x1   = wallX + dir*near;
    const zx   = Math.min(x0,x1);
    const zw   = Math.abs(x1-x0);

    ctx.fillStyle=colors[i];
    ctx.fillRect(zx, BY, zw, BH);

    // Zone boundary line (at 'far' edge)
    const lineX = wallX + dir*far;
    ctx.strokeStyle="rgba(100,70,30,0.4)";
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(lineX, BY); ctx.lineTo(lineX, BY+BH);
    ctx.stroke();

    // Label centred in zone
    const midX = zx + zw/2;
    ctx.fillStyle="rgba(80,50,20,0.55)";
    ctx.font=`bold ${Math.floor(BH*0.11)}px 'Bebas Neue',sans-serif`;
    ctx.textAlign="center";
    ctx.textBaseline="top";
    ctx.fillText(labels[i], midX, BY+6);
    ctx.textBaseline="bottom";
    ctx.fillText(labels[i], midX, BY+BH-4);
  }
}

function roundRect(ctx,x,y,w,h,r){
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

/* ─── Main loop ─── */
function loop(){
  if(gameState==="playing"){
    physics();
    // Only try to spawn when nothing is moving and no active puck
    if(!activePuck && !endRoundScheduled && pucks.every(p=>!p.moving)){
      if(pucksLeft[0]>0 || pucksLeft[1]>0){
        spawnPuck();
      } else {
        endRound();
      }
    }
  }
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
